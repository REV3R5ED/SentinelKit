name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Lint
        run: ruff check src tests
      - name: Check formatting
        run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Validate wheel install
        run: |
          python -m pip install dist/*.whl
          sentinelkit --help
      - name: Validate source distribution contents
        run: |
          python -m pip install --force-reinstall dist/*.tar.gz
          python -c "import sentinelkit; print(sentinelkit.__file__)"
      - name: Verify release artifacts exist
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
      - name: Preserve validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: sentinelkit-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
