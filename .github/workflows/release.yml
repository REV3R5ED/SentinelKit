name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run full test suite
        run: python -m pytest
      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          PY
          )"
          test "$tag_version" = "$package_version" || {
            echo "Tag version $tag_version does not match package version $package_version" >&2
            exit 1
          }
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          sentinelkit --help
          python -c "import sentinelkit; print(sentinelkit.__file__)"
      - name: Preserve validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: sentinelkit-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sentinelkit-release-${{ github.ref_name }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "SentinelKit ${GITHUB_REF_NAME}"
