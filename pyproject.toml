[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelkit"
version = "0.1.0"
description = "Defensive security utilities for fast, explainable analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "REV3R5ED"}]
keywords = [
  "cybersecurity",
  "blue-team",
  "soc",
  "incident-response",
  "ioc",
  "log-analysis",
  "defensive-security",
  "security-tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Repository = "https://github.com/REV3R5ED/SentinelKit"
Issues = "https://github.com/REV3R5ED/SentinelKit/issues"

[project.scripts]
sentinelkit = "sentinelkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# Pinned rule set so CI is stable across ruff releases. DTZ is excluded on
# purpose: syslog timestamps carry no zone, so SentinelKit normalizes parsed
# timestamps to naive UTC for consistent brute-force window arithmetic.
select = ["E", "F", "I", "PLC", "RUF", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true

[tool.coverage.run]
source = ["sentinelkit"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == ['\"]__main__['\"]:",
    "raise AssertionError",
]
